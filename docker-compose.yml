services:
  capivara_wp:
    image: wordpress:7.1.3-php8.4-apache
    container_name: capivara_wp
    restart: unless-stopped
    env_file: .env        # usuário/senha do banco e os 8 salts (nunca repetir no environment)
    environment:
      WORDPRESS_DB_HOST: db_wp_vampiro
      WORDPRESS_DB_NAME: wp_capivara
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'https://capivaradeprograma.com.br');
        define('WP_SITEURL', 'https://capivaradeprograma.com.br');
        define('DISABLE_WP_CRON', true);
      VIRTUAL_HOST: capivaradeprograma.com.br,www.capivaradeprograma.com.br
      LETSENCRYPT_HOST: capivaradeprograma.com.br,www.capivaradeprograma.com.br
      LETSENCRYPT_EMAIL: capivaradeprograma@gmail.com
    volumes:
      - ./wp-content:/var/www/html/wp-content
      - ./php-uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro
    mem_limit: 512m       # um pico aqui não aperta o blog nem o n8n
    networks:
      - proxy             # onde está o nginx-proxy
      - rede_banco        # onde está o db_wp_vampiro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
    name: vampiro_wordpress_vampiro_network
  rede_banco:
    external: true
    name: vampiro_network
